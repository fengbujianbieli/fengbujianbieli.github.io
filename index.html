<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎来到我的主页</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #0366d6;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
    }
    header p {
      font-size: 1.2rem;
      margin-top: 10px;
    }
    main {
      flex: 1;
      padding: 40px 20px;
      max-width: 960px;
      margin: auto;
    }
    section {
      margin-bottom: 40px;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.3s ease;
    }
    .project-card:hover {
      transform: translateY(-5px);
    }
    .project-card h3 {
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #f2f2f2;
    }
    .social-links a {
      margin: 0 10px;
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>你好，我是你的名字</h1>
    <p>我是一名前端/后端/安全研究员/AI爱好者（自定义）</p>
  </header>

  <main>
    <section>
      <h2>🧠 关于我</h2>
      <p>这里写一段你的简介，技能、兴趣方向、擅长技术等。</p>
    </section>

    <section>
      <h2>🚀 我的项目</h2>
      <div class="projects">
        <div class="project-card">
          <h3>🛠️ 项目名称 1</h3>
          <p>项目简要介绍，一句话描述功能或特色。</p>
          <a href="https://github.com/你的用户名/项目1" target="_blank">查看项目 →</a>
        </div>
        <div class="project-card">
          <h3>📦 项目名称 2</h3>
          <p>项目简要介绍，描述它的用途或优势。</p>
          <a href="https://github.com/你的用户名/项目2" target="_blank">查看项目 →</a>
        </div>
        <!-- 可继续添加项目卡片 -->
      </div>
    </section>

    <section>
      <h2>📫 联系方式</h2>
      <div class="social-links">
        <a href="https://github.com/你的用户名" target="_blank">GitHub</a>
        <a href="mailto:your@email.com">Email</a>
        <!-- 可添加 LinkedIn / 个人网站 / 博客 -->
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 你的名字 | 本页面使用 GitHub Pages 构建
  </footer>
</body>
</html>
