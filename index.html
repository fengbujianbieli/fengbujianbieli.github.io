<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 60px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 24px;
            border-left: 5px solid #409eff;
            padding-left: 16px;
        }
        .task-desc {
            font-size: 17px;
            line-height: 1.8;
            color: #444;
        }
        .tip-box {
            margin-top: 30px;
            padding: 18px;
            background-color: #eef5ff;
            border-radius: 8px;
            border: 1px solid #d0e4ff;
        }
        .tip-box h3 {
            color: #337ecc;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .tip-box p {
            color: #555;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>页面制作任务</h1>
        <div class="task-desc">
            <p>你的任务是完成类似于当前展示样式的页面，页面需求说明：</p>
            <br>
            <p>多喝热水</p>

        </div>

        </div>
    </div>
</body>
</html>
